<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caesar Cipher</title>
<style>
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: #f2f4f8;
    margin: 0;
    padding: 24px 16px;
    text-align: center;
    color: #222;
  }
  h1 { font-size: 24px; margin: 0 0 8px; }
  h2 { font-size: 18px; font-weight: normal; margin: 0 0 32px; color: #444; }
  .box {
    background: #fff;
    max-width: 420px;
    margin: 0 auto;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
  }
  label { display: block; margin: 14px 0 6px; font-weight: bold; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
    direction: ltr;
    text-align: center;
  }
  button {
    margin-top: 18px;
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #2f6fed;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #1f58c7; }
  .modes label { display: inline-block; margin: 4px 8px; font-weight: normal; }
  .modes input { width: auto; direction: rtl; }
  #result {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    direction: ltr;
    min-height: 30px;
    word-break: break-all;
  }
</style>
</head>
<body>

  <h1>Task 1 for Eng/ عاصم</h1>
  <h2>حسن جهاد عبدالله عبدالله عبدالرحمن</h2>

  <div class="box">
    <label for="word">ادخل الكلمه لفك التشفير</label>
    <input type="text" id="word" placeholder="مثال: Khoor">

    <label for="shift">قيمة الإزاحة (Shift)</label>
    <input type="number" id="shift" value="3" min="1" max="25">

    <label>الطريقة</label>
    <div class="modes">
      <label><input type="radio" name="mode" value="minus" checked> Minus (Decrypt)</label>
      <label><input type="radio" name="mode" value="plus"> Plus (Encrypt)</label>
    </div>

    <button onclick="decrypt()">تنفيذ</button>

    <div id="result"></div>
  </div>

<script>
  function caesarDecrypt(text, shift) {
    let out = "";
    for (const ch of text) {
      const code = ch.charCodeAt(0);
      if (code >= 65 && code <= 90) {
        out += String.fromCharCode((code - 65 - shift + 26) % 26 + 65);
      } else if (code >= 97 && code <= 122) {
        out += String.fromCharCode((code - 97 - shift + 26) % 26 + 97);
      } else {
        out += ch;
      }
    }
    return out;
  }

  function decrypt() {
    const word = document.getElementById("word").value;
    let shift = parseInt(document.getElementById("shift").value, 10);
    if (isNaN(shift)) shift = 3;
    shift = ((shift % 26) + 26) % 26;
    const mode = document.querySelector('input[name="mode"]:checked').value;
    // نقص = فك التشفير (نرجع للخلف)، زيادة = تشفير (نتقدم للأمام)
    const finalShift = mode === "minus" ? shift : (26 - shift) % 26;
    document.getElementById("result").textContent = caesarDecrypt(word, finalShift);
  }

  document.getElementById("word").addEventListener("keydown", function (e) {
    if (e.key === "Enter") decrypt();
  });
</script>

</body>
</html>
